<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AI review loop">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#123c66">AI help stays inside review</text>
  <text x="72" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#4e5b66">The loop makes assistance visible, bounded, and checkable.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="112" y="234" width="224" height="126" fill="#f3f1fb" stroke="#5f56b3" stroke-width="5"/>
    <text x="224" y="281" text-anchor="middle" font-size="30" font-weight="700" fill="#5f56b3">Ask</text>
    <text x="224" y="321" text-anchor="middle" font-size="21" fill="#26313c">specific and</text>
    <text x="224" y="350" text-anchor="middle" font-size="21" fill="#26313c">scoped</text>
    <rect x="408" y="234" width="224" height="126" fill="#edf3f8" stroke="#123c66" stroke-width="5"/>
    <text x="520" y="281" text-anchor="middle" font-size="30" font-weight="700" fill="#123c66">Inspect</text>
    <text x="520" y="321" text-anchor="middle" font-size="21" fill="#26313c">read diffs and</text>
    <text x="520" y="350" text-anchor="middle" font-size="21" fill="#26313c">understand code</text>
    <rect x="704" y="234" width="224" height="126" fill="#edf6f2" stroke="#2a7f62" stroke-width="5"/>
    <text x="816" y="281" text-anchor="middle" font-size="30" font-weight="700" fill="#2a7f62">Rerun</text>
    <text x="816" y="321" text-anchor="middle" font-size="21" fill="#26313c">affected scripts</text>
    <text x="816" y="350" text-anchor="middle" font-size="21" fill="#26313c">and renders</text>
    <rect x="1000" y="234" width="224" height="126" fill="#fbf1eb" stroke="#b35c33" stroke-width="5"/>
    <text x="1112" y="281" text-anchor="middle" font-size="30" font-weight="700" fill="#b35c33">Document</text>
    <text x="1112" y="321" text-anchor="middle" font-size="21" fill="#26313c">log meaningful</text>
    <text x="1112" y="350" text-anchor="middle" font-size="21" fill="#26313c">AI use</text>
    <g stroke="#9aa8b5" stroke-width="6" stroke-linecap="round">
      <line x1="336" y1="297" x2="408" y2="297"/>
      <line x1="632" y1="297" x2="704" y2="297"/>
      <line x1="928" y1="297" x2="1000" y2="297"/>
      <path d="M1112 360 C1080 508 250 508 224 360" fill="none"/>
    </g>
    <rect x="358" y="520" width="564" height="82" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="640" y="554" text-anchor="middle" font-size="27" font-weight="700" fill="#123c66">Human decision remains the gate</text>
    <text x="640" y="586" text-anchor="middle" font-size="21" fill="#26313c">AI output is a proposal until reviewed.</text>
  </g>
</svg>