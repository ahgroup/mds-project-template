<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Example workflow run order">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#123c66">Run order: compute, then communicate</text>
  <text x="72" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#4e5b66">The workflow is reproducible without needing one giant run-all script.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="225" width="190" height="132" fill="#edf3f8" stroke="#123c66" stroke-width="5"/>
    <text x="185" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#123c66">1. Process</text>
    <text x="185" y="310" text-anchor="middle" font-size="21" fill="#26313c">raw to</text>
    <text x="185" y="340" text-anchor="middle" font-size="21" fill="#26313c">processed</text>
    <rect x="330" y="225" width="190" height="132" fill="#edf6f2" stroke="#2a7f62" stroke-width="5"/>
    <text x="425" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#2a7f62">2. Explore</text>
    <text x="425" y="310" text-anchor="middle" font-size="21" fill="#26313c">checks and</text>
    <text x="425" y="340" text-anchor="middle" font-size="21" fill="#26313c">summaries</text>
    <rect x="570" y="225" width="190" height="132" fill="#fbf1eb" stroke="#b35c33" stroke-width="5"/>
    <text x="665" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#b35c33">3. Analyze</text>
    <text x="665" y="310" text-anchor="middle" font-size="21" fill="#26313c">models and</text>
    <text x="665" y="340" text-anchor="middle" font-size="21" fill="#26313c">results</text>
    <rect x="810" y="225" width="190" height="132" fill="#f3f1fb" stroke="#5f56b3" stroke-width="5"/>
    <text x="905" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#5f56b3">4. Package</text>
    <text x="905" y="310" text-anchor="middle" font-size="21" fill="#26313c">figures and</text>
    <text x="905" y="340" text-anchor="middle" font-size="21" fill="#26313c">tables</text>
    <rect x="1050" y="225" width="190" height="132" fill="#edf3f6" stroke="#4e5b66" stroke-width="5"/>
    <text x="1145" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#4e5b66">5. Render</text>
    <text x="1145" y="310" text-anchor="middle" font-size="21" fill="#26313c">reports and</text>
    <text x="1145" y="340" text-anchor="middle" font-size="21" fill="#26313c">slides</text>
    <g stroke="#9aa8b5" stroke-width="6" stroke-linecap="round">
      <line x1="280" y1="291" x2="330" y2="291"/>
      <line x1="520" y1="291" x2="570" y2="291"/>
      <line x1="760" y1="291" x2="810" y2="291"/>
      <line x1="1000" y1="291" x2="1050" y2="291"/>
    </g>
    <rect x="180" y="500" width="920" height="84" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="640" y="535" text-anchor="middle" font-size="27" font-weight="700" fill="#123c66">Regenerate results before rendering products</text>
    <text x="640" y="568" text-anchor="middle" font-size="21" fill="#26313c">A stale report is often just an old render of otherwise correct code.</text>
  </g>
</svg>