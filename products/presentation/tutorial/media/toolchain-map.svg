<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Toolchain map">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#123c66">Tool jobs in plain language</text>
  <text x="72" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#4e5b66">No tool needs to be mysterious: each one serves a specific workflow role.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="186" width="214" height="360" fill="#edf3f8" stroke="#123c66" stroke-width="5"/>
    <text x="175" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#123c66">IDE</text>
    <text x="175" y="293" text-anchor="middle" font-size="24" fill="#26313c">The workbench</text>
    <text x="175" y="336" text-anchor="middle" font-size="22" fill="#26313c">edit files</text>
    <text x="175" y="370" text-anchor="middle" font-size="22" fill="#26313c">run code</text>
    <text x="175" y="404" text-anchor="middle" font-size="22" fill="#26313c">view outputs</text>

    <rect x="306" y="186" width="214" height="360" fill="#edf6f2" stroke="#2a7f62" stroke-width="5"/>
    <text x="413" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#2a7f62">R / Python</text>
    <text x="413" y="293" text-anchor="middle" font-size="24" fill="#26313c">Computation</text>
    <text x="413" y="336" text-anchor="middle" font-size="22" fill="#26313c">clean data</text>
    <text x="413" y="370" text-anchor="middle" font-size="22" fill="#26313c">fit models</text>
    <text x="413" y="404" text-anchor="middle" font-size="22" fill="#26313c">save results</text>

    <rect x="544" y="186" width="214" height="360" fill="#fbf1eb" stroke="#b35c33" stroke-width="5"/>
    <text x="651" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#b35c33">Quarto</text>
    <text x="651" y="293" text-anchor="middle" font-size="24" fill="#26313c">Publishing</text>
    <text x="651" y="336" text-anchor="middle" font-size="22" fill="#26313c">reports</text>
    <text x="651" y="370" text-anchor="middle" font-size="22" fill="#26313c">manuscripts</text>
    <text x="651" y="404" text-anchor="middle" font-size="22" fill="#26313c">slides</text>

    <rect x="782" y="186" width="214" height="360" fill="#f3f1fb" stroke="#5f56b3" stroke-width="5"/>
    <text x="889" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#5f56b3">GitHub</text>
    <text x="889" y="293" text-anchor="middle" font-size="24" fill="#26313c">History + share</text>
    <text x="889" y="336" text-anchor="middle" font-size="22" fill="#26313c">commit</text>
    <text x="889" y="370" text-anchor="middle" font-size="22" fill="#26313c">push / pull</text>
    <text x="889" y="404" text-anchor="middle" font-size="22" fill="#26313c">review</text>

    <rect x="1020" y="186" width="214" height="360" fill="#edf3f6" stroke="#4e5b66" stroke-width="5"/>
    <text x="1127" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#4e5b66">AI</text>
    <text x="1127" y="293" text-anchor="middle" font-size="24" fill="#26313c">Assistance</text>
    <text x="1127" y="336" text-anchor="middle" font-size="22" fill="#26313c">draft</text>
    <text x="1127" y="370" text-anchor="middle" font-size="22" fill="#26313c">explain</text>
    <text x="1127" y="404" text-anchor="middle" font-size="22" fill="#26313c">check</text>
  </g>
  <rect x="240" y="602" width="800" height="58" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
  <text x="640" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#123c66">The template is the shared map that keeps the tools coordinated.</text>
</svg>