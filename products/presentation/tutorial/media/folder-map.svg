  <text x="72" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#4e5b66">Support folders document, cite, and make AI assistance visible.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="230" width="220" height="128" fill="#edf3f8" stroke="#123c66" stroke-width="5"/>
    <text x="180" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#123c66">data/</text>
    <text x="180" y="324" text-anchor="middle" font-size="21" fill="#26313c">inputs and derived data</text>
    <rect x="370" y="230" width="220" height="128" fill="#edf6f2" stroke="#2a7f62" stroke-width="5"/>
    <text x="480" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#2a7f62">code/</text>
    <text x="480" y="324" text-anchor="middle" font-size="21" fill="#26313c">workflow stages</text>
    <rect x="670" y="230" width="220" height="128" fill="#fbf1eb" stroke="#b35c33" stroke-width="5"/>
    <text x="780" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#b35c33">results/</text>
    <text x="780" y="324" text-anchor="middle" font-size="21" fill="#26313c">code-generated outputs</text>
    <rect x="970" y="230" width="220" height="128" fill="#f3f1fb" stroke="#5f56b3" stroke-width="5"/>
    <text x="1080" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#5f56b3">products/</text>
    <text x="1080" y="324" text-anchor="middle" font-size="21" fill="#26313c">audience deliverables</text>
    <g stroke="#9aa8b5" stroke-width="6" stroke-linecap="round">
      <line x1="290" y1="294" x2="370" y2="294"/>
      <line x1="590" y1="294" x2="670" y2="294"/>
      <line x1="890" y1="294" x2="970" y2="294"/>
    </g>
    <rect x="190" y="494" width="240" height="96" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="310" y="535" text-anchor="middle" font-size="30" font-weight="700" fill="#4e5b66">assets/</text>
    <text x="310" y="568" text-anchor="middle" font-size="20" fill="#26313c">stable support material</text>
    <rect x="520" y="494" width="240" height="96" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="640" y="535" text-anchor="middle" font-size="30" font-weight="700" fill="#4e5b66">docs</text>
    <text x="640" y="568" text-anchor="middle" font-size="20" fill="#26313c">readme, usage, guidelines</text>
    <rect x="850" y="494" width="240" height="96" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="970" y="535" text-anchor="middle" font-size="30" font-weight="700" fill="#4e5b66">ai/</text>
    <text x="970" y="568" text-anchor="middle" font-size="20" fill="#26313c">policy, summary, log</text>
