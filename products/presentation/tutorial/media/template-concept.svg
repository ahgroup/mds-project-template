<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Template concept for AI assisted reproducible analysis">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#123c66">The template keeps the pieces connected</text>
  <text x="72" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#4e5b66">Data, code, outputs, products, AI help, and human decisions all have a defined place.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="228" width="180" height="110" fill="#edf3f8" stroke="#123c66" stroke-width="5"/>
    <text x="182" y="291" text-anchor="middle" font-size="31" font-weight="700" fill="#123c66">Data</text>
    <rect x="328" y="228" width="180" height="110" fill="#edf6f2" stroke="#2a7f62" stroke-width="5"/>
    <text x="418" y="291" text-anchor="middle" font-size="31" font-weight="700" fill="#2a7f62">Code</text>
    <rect x="564" y="228" width="180" height="110" fill="#fbf1eb" stroke="#b35c33" stroke-width="5"/>
    <text x="654" y="291" text-anchor="middle" font-size="31" font-weight="700" fill="#b35c33">Results</text>
    <rect x="800" y="228" width="180" height="110" fill="#f3f1fb" stroke="#5f56b3" stroke-width="5"/>
    <text x="890" y="291" text-anchor="middle" font-size="31" font-weight="700" fill="#5f56b3">Products</text>
    <rect x="1036" y="228" width="180" height="110" fill="#edf3f6" stroke="#4e5b66" stroke-width="5"/>
    <text x="1126" y="291" text-anchor="middle" font-size="31" font-weight="700" fill="#4e5b66">Share</text>
    <g stroke="#9aa8b5" stroke-width="6" stroke-linecap="round">
      <line x1="272" y1="283" x2="328" y2="283"/>
      <line x1="508" y1="283" x2="564" y2="283"/>
      <line x1="744" y1="283" x2="800" y2="283"/>
      <line x1="980" y1="283" x2="1036" y2="283"/>
    </g>
    <rect x="160" y="464" width="440" height="112" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="380" y="510" text-anchor="middle" font-size="29" font-weight="700" fill="#123c66">AI assistance</text>
    <text x="380" y="548" text-anchor="middle" font-size="22" fill="#26313c">Draft, explain, check, and document</text>
    <rect x="680" y="464" width="440" height="112" fill="#f4f7f9" stroke="#cfd7e0" stroke-width="4"/>
    <text x="900" y="510" text-anchor="middle" font-size="29" font-weight="700" fill="#123c66">Human review</text>
    <text x="900" y="548" text-anchor="middle" font-size="22" fill="#26313c">Decide, verify, interpret, and approve</text>
  </g>
</svg>